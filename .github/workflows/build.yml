name: Build Gym Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: node --test scripts/access.test.mjs scripts/resident.test.mjs scripts/coach.test.mjs scripts/syndic.test.mjs scripts/workout-execution.test.mjs
      - name: Build
        run: npm run build
